ui sunt păstrate atât timp cât este necesar pentru funcționarea aplicației sau până când utilizatorul solicită ștergerea, ținând cont de obligațiile legale de păstrare.", "retention_p2": "Utilizatorul poate solicita ștergerea contului și a datelor personale la următoarea adresă de e-mail:", "retention_p3": "După primirea cererii de ștergere, MATCHFLOW va lua măsurile necesare pentru ștergerea datelor relevante, cu excepția datelor care trebuie păstrate conform legii.", "rights_h": "7. Drepturile utilizatorilor", "rights_p": "În funcție de legislația aplicabilă, utilizatorul poate avea dreptul să:", "rights_items": ["solicite informații despre datele personale prelucrate;", "solicite corectarea datelor inexacte;", "solicite ștergerea datelor personale;", "solicite restricționarea prelucrării atunci când sunt îndeplinite condițiile legale;", "se opună prelucrării atunci când sunt îndeplinite condițiile legale."], "rights_end": "Astfel de solicitări pot fi trimise la adresa de contact indicată în această Politică de confidențialitate.", "children_h": "8. Datele copiilor", "children_p": "MATCHFLOW nu este destinat copiilor și nu colectează în mod conștient date personale de la copii.", "changes_h": "9. Modificarea acestei Politici de confidențialitate", "changes_p1": "Această Politică de confidențialitate poate fi actualizată atunci când este necesar, de exemplu dacă se modifică funcțiile aplicației sau modul de prelucrare a datelor.", "changes_p2": "Versiunea actuală va fi disponibilă întotdeauna pe această pagină.", "contact_h": "10. Contact", "contact_p": "Pentru întrebări privind confidențialitatea, prelucrarea datelor sau ștergerea datelor, vă rugăm să contactați:", "footer": "MATCHFLOW / Bogyó Gergő", "email": "matchflowhungary@gmail.com"}, "pl": {"title": "MATCHFLOW – Polityka prywatności", "effective": "Data wejścia w życie:", "date": "11 września 2026 r.", "intro": "Niniejsza Polityka prywatności wyjaśnia, w jaki sposób MATCHFLOW („Aplikacja”) przetwarza dane osobowe użytkowników aplikacji mobilnej MATCHFLOW.", "h1": "1. Administrator danych", "controller": "MATCHFLOW / Bogyó Gergő", "contact_label": "Kontakt w sprawach prywatności:", "contact_text": "Pytania dotyczące przetwarzania danych oraz żądania usunięcia danych można przesyłać na ten adres e-mail.", "data_h": "2. Jakie dane przetwarza MATCHFLOW?", "data_p1": "Do korzystania z niektórych funkcji MATCHFLOW wymagane jest konto użytkownika.", "data_p2": "Podczas tworzenia i korzystania z konta MATCHFLOW przetwarza dane niezbędne do uwierzytelniania za pośrednictwem Firebase Authentication. MATCHFLOW korzysta z uwierzytelniania za pomocą adresu e-mail i hasła. Aplikacja nie korzysta z logowania za pomocą konta Google.", "data_p3": "Aplikacja może również przetwarzać dane zawodów utworzone i wprowadzone przez użytkownika, w tym:", "items": ["dane zawodów;", "dane rund;", "dane ważenia i wyniki;", "notatki i inne informacje wprowadzone przez użytkownika w związku z zawodami."], "not_sell": "MATCHFLOW nie sprzedaje danych osobowych użytkowników.", "purpose_h": "3. Cele przetwarzania danych", "purpose_p": "Dane są wykorzystywane do celów niezbędnych do działania aplikacji, w szczególności:", "purpose_items": ["identyfikacji i logowania użytkownika;", "zapisywania zawodów i wyników utworzonych przez użytkownika;", "zapewnienia synchronizacji w chmurze;", "przywracania wcześniejszych zawodów i wyników;", "utrzymania działania, wydajności i bezpieczeństwa aplikacji;", "analizy korzystania z aplikacji i jej funkcji za pomocą Firebase Analytics."], "provider_h": "4. Dostawcy usług zewnętrznych", "provider_p": "Aplikacja korzysta z usług Google Firebase, w tym:", "provider_items": ["Firebase Authentication – uwierzytelnianie użytkownika za pomocą adresu e-mail i hasła;", "Cloud Firestore – przechowywanie danych i synchronizacja w chmurze;", "Firebase Analytics – statystyczna analiza korzystania z aplikacji i zdarzeń."], "provider_end": "Firebase jest usługą świadczoną przez Google. Dane oraz zdarzenia związane z korzystaniem z aplikacji są przetwarzane w zakresie niezbędnym do działania usług i ulepszania aplikacji.", "security_h": "5. Bezpieczeństwo danych", "security_p": "MATCHFLOW oraz usługi wykorzystywane przez aplikację stosują odpowiednie środki techniczne i organizacyjne mające na celu zapobieganie nieuprawnionemu dostępowi do danych, ich utracie lub nieuprawnionemu wykorzystaniu.", "retention_h": "6. Przechowywanie i usuwanie danych", "retention_p1": "Dane użytkownika są przechowywane tak długo, jak jest to niezbędne do działania aplikacji lub do czasu żądania ich usunięcia przez użytkownika, z uwzględnieniem obowiązków prawnych dotyczących przechowywania danych.", "retention_p2": "Użytkownik może poprosić o usunięcie swojego konta i danych osobowych pod następującym adresem e-mail:", "retention_p3": "Po otrzymaniu żądania usunięcia MATCHFLOW podejmie niezbędne działania w celu usunięcia odpowiednich danych, z wyjątkiem danych, które muszą być przechowywane zgodnie z prawem.", "rights_h": "7. Prawa użytkowników", "rights_p": "W zależności od obowiązującego prawa użytkownik może mieć prawo do:", "rights_items": ["uzyskania informacji o przetwarzanych danych osobowych;", "żądania sprostowania nieprawidłowych danych;", "żądania usunięcia danych osobowych;", "żądania ograniczenia przetwarzania, jeżeli spełnione są warunki prawne;", "sprzeciwu wobec przetwarzania, jeżeli spełnione są warunki prawne."], "rights_end": "Takie żądania można przesyłać na adres kontaktowy podany w niniejszej Polityce prywatności.", "children_h": "8. Dane dzieci", "children_p": "MATCHFLOW nie jest przeznaczony dla dzieci i świadomie nie zbiera danych osobowych dzieci.", "changes_h": "9. Zmiany Polityki prywatności", "changes_p1": "Niniejsza Polityka prywatności może być aktualizowana w razie potrzeby, na przykład w przypadku zmian funkcji aplikacji lub sposobu przetwarzania danych.", "changes_p2": "Aktualna wersja będzie zawsze dostępna na tej stronie.", "contact_h": "10. Kontakt", "contact_p": "W sprawach dotyczących prywatności, przetwarzania danych lub ich usunięcia prosimy o kontakt:", "footer": "MATCHFLOW / Bogyó Gergő", "email": "matchflowhungary@gmail.com"}, "it": {"title": "MATCHFLOW – Informativa sulla privacy", "effective": "Data di entrata in vigore:", "date": "11 settembre 2026.", "intro": "La presente Informativa sulla privacy spiega come MATCHFLOW (l’“Applicazione”) tratta i dati personali degli utenti dell’applicazione mobile MATCHFLOW.", "h1": "1. Titolare del trattamento", "controller": "MATCHFLOW / Bogyó Gergő", "contact_label": "Contatto privacy:", "contact_text": "Le domande sul trattamento dei dati e le richieste di cancellazione possono essere inviate a questo indirizzo e-mail.", "data_h": "2. Quali dati tratta MATCHFLOW?", "data_p1": "Per utilizzare alcune funzioni di MATCHFLOW è necessario un account utente.", "data_p2": "Durante la creazione e l’utilizzo di un account, MATCHFLOW tratta i dati necessari all’autenticazione tramite Firebase Authentication. MATCHFLOW utilizza l’autenticazione tramite e-mail/password. L’applicazione non utilizza l’accesso tramite account Google.", "data_p3": "L’applicazione può inoltre trattare i dati delle competizioni creati e inseriti dall’utente, tra cui:", "items": ["dati delle competizioni;", "dati delle manche;", "dati di pesatura e risultati;", "note e altre informazioni inserite dall’utente relative alle competizioni."], "not_sell": "MATCHFLOW non vende i dati personali degli utenti.", "purpose_h": "3. Finalità del trattamento", "purpose_p": "I dati vengono utilizzati per finalità necessarie al funzionamento dell’applicazione, in particolare:", "purpose_items": ["identificare e autenticare l’utente;", "salvare competizioni e risultati creati dall’utente;", "fornire la sincronizzazione cloud;", "ripristinare competizioni e risultati precedenti;", "mantenere il funzionamento, le prestazioni e la sicurezza dell’applicazione;", "analizzare l’utilizzo dell’applicazione e delle sue funzioni tramite Firebase Analytics."], "provider_h": "4. Fornitori di servizi terzi", "provider_p": "L’applicazione utilizza i servizi Google Firebase, tra cui:", "provider_items": ["Firebase Authentication – autenticazione utente tramite e-mail/password;", "Cloud Firestore – archiviazione e sincronizzazione dei dati nel cloud;", "Firebase Analytics – analisi statistica dell’utilizzo dell’applicazione e degli eventi."], "provider_end": "Firebase è un servizio fornito da Google. I dati e gli eventi di utilizzo dell’applicazione vengono trattati nella misura necessaria per il funzionamento dei servizi e il miglioramento dell’applicazione.", "security_h": "5. Sicurezza dei dati", "security_p": "MATCHFLOW e i servizi utilizzati dall’applicazione adottano misure tecniche e organizzative adeguate per prevenire l’accesso non autorizzato, la perdita o l’utilizzo non autorizzato dei dati trattati.", "retention_h": "6. Conservazione e cancellazione dei dati", "retention_p1": "I dati dell’utente vengono conservati per il tempo necessario al funzionamento dell’applicazione o fino a quando l’utente ne richiede la cancellazione, nel rispetto degli eventuali obblighi legali di conservazione.", "retention_p2": "L’utente può richiedere la cancellazione del proprio account e dei dati personali al seguente indirizzo e-mail:", "retention_p3": "Dopo aver ricevuto una richiesta di cancellazione, MATCHFLOW adotterà le misure necessarie per cancellare i dati pertinenti, ad eccezione dei dati che devono essere conservati per legge.", "rights_h": "7. Diritti degli utenti", "rights_p": "In base alla legge applicabile, l’utente può avere il diritto di:", "rights_items": ["richiedere informazioni sui dati personali trattati;", "richiedere la rettifica dei dati inesatti;", "richiedere la cancellazione dei dati personali;", "richiedere la limitazione del trattamento quando ne ricorrono i presupposti;", "opporsi al trattamento quando ne ricorrono i presupposti di legge."], "rights_end": "Tali richieste possono essere inviate all’indirizzo e-mail di contatto indicato nella presente Informativa.", "children_h": "8. Dati dei minori", "children_p": "MATCHFLOW non è destinato ai minori e non raccoglie consapevolmente dati personali di minori.", "changes_h": "9. Modifiche alla presente Informativa", "changes_p1": "La presente Informativa può essere aggiornata quando necessario, ad esempio in caso di modifiche alle funzioni dell’applicazione o alle modalità di trattamento dei dati.", "changes_p2": "La versione vigente sarà sempre disponibile su questa pagina.", "contact_h": "10. Contatti", "contact_p": "Per domande sulla privacy, richieste relative al trattamento dei dati o richieste di cancellazione, contattare:", "footer": "MATCHFLOW / Bogyó Gergő", "email": "matchflowhungary@gmail.com"}, "fr": {"title": "MATCHFLOW – Politique de confidentialité", "effective": "Date d’entrée en vigueur :", "date": "11 septembre 2026.", "intro": "La présente Politique de confidentialité explique comment MATCHFLOW (l’« Application ») traite les données personnelles des utilisateurs de l’application mobile MATCHFLOW.", "h1": "1. Responsable du traitement", "controller": "MATCHFLOW / Bogyó Gergő", "contact_label": "Contact confidentialité :", "contact_text": "Les questions concernant le traitement des données et les demandes de suppression peuvent être envoyées à cette adresse e-mail.", "data_h": "2. Quelles données MATCHFLOW traite-t-il ?", "data_p1": "Un compte utilisateur est nécessaire pour utiliser certaines fonctions de MATCHFLOW.", "data_p2": "Lors de la création et de l’utilisation d’un compte, MATCHFLOW traite les données nécessaires à l’authentification via Firebase Authentication. MATCHFLOW utilise l’authentification par e-mail/mot de passe. L’application n’utilise pas la connexion avec un compte Google.", "data_p3": "L’application peut également traiter les données de compétition créées et saisies par l’utilisateur, notamment :", "items": ["données des compétitions ;", "données des manches ;", "données de pesée et résultats ;", "notes et autres informations saisies par l’utilisateur dans le cadre des compétitions."], "not_sell": "MATCHFLOW ne vend pas les données personnelles des utilisateurs.", "purpose_h": "3. Finalités du traitement", "purpose_p": "Les données sont utilisées aux fins nécessaires au fonctionnement de l’application, notamment pour :", "purpose_items": ["identifier et connecter l’utilisateur ;", "enregistrer les compétitions et résultats créés par l’utilisateur ;", "assurer la synchronisation dans le cloud ;", "restaurer les compétitions et résultats précédents ;", "maintenir le fonctionnement, les performances et la sécurité de l’application ;", "analyser l’utilisation de l’application et de ses fonctions à l’aide de Firebase Analytics."], "provider_h": "4. Prestataires de services tiers", "provider_p": "L’application utilise des services Google Firebase, notamment :", "provider_items": ["Firebase Authentication – authentification de l’utilisateur par e-mail/mot de passe ;", "Cloud Firestore – stockage et synchronisation des données dans le cloud ;", "Firebase Analytics – analyse statistique de l’utilisation de l’application et des événements."], "provider_end": "Firebase est un service fourni par Google. Les données et événements d’utilisation de l’application sont traités dans la mesure nécessaire au fonctionnement des services et à l’amélioration de l’application.", "security_h": "5. Sécurité des données", "security_p": "MATCHFLOW et les services utilisés par l’application mettent en œuvre des mesures techniques et organisationnelles appropriées afin de prévenir les accès non autorisés, la perte ou l’utilisation non autorisée des données traitées.", "retention_h": "6. Conservation et suppression des données", "retention_p1": "Les données utilisateur sont conservées aussi longtemps que nécessaire au fonctionnement de l’application ou jusqu’à ce que l’utilisateur demande leur suppression, sous réserve des obligations légales de conservation.", "retention_p2": "L’utilisateur peut demander la suppression de son compte et de ses données personnelles à l’adresse e-mail suivante :", "retention_p3": "Après réception d’une demande de suppression, MATCHFLOW prendra les mesures nécessaires pour supprimer les données concernées, à l’exception des données qui doivent être conservées en vertu de la loi.", "rights_h": "7. Droits des utilisateurs", "rights_p": "Selon la législation applicable, l’utilisateur peut notamment avoir le droit de :", "rights_items": ["demander des informations sur les données personnelles traitées ;", "demander la rectification des données inexactes ;", "demander la suppression des données personnelles ;", "demander la limitation du traitement lorsque les conditions légales sont réunies ;", "s’opposer au traitement lorsque les conditions légales applicables sont réunies."], "rights_end": "Ces demandes peuvent être envoyées à l’adresse e-mail de contact indiquée dans la présente Politique.", "children_h": "8. Données des enfants", "children_p": "MATCHFLOW n’est pas destiné aux enfants et ne collecte pas sciemment de données personnelles auprès d’enfants.", "changes_h": "9. Modifications de la présente Politique", "changes_p1": "Cette Politique peut être mise à jour si nécessaire, notamment en cas de modification des fonctions de l’application ou des pratiques de traitement des données.", "changes_p2": "La version en vigueur sera toujours disponible sur cette page.", "contact_h": "10. Contact", "contact_p": "Pour toute question relative à la confidentialité, au traitement des données ou à leur suppression, veuillez contacter :", "footer": "MATCHFLOW / Bogyó Gergő", "email": "matchflowhungary@gmail.com"}, "nl": {"title": "MATCHFLOW – Privacybeleid", "effective": "Ingangsdatum:", "date": "11 september 2026.", "intro": "Dit Privacybeleid legt uit hoe MATCHFLOW (de “Applicatie”) persoonsgegevens van gebruikers van de mobiele MATCHFLOW-applicatie verwerkt.", "h1": "1. Verwerkingsverantwoordelijke", "controller": "MATCHFLOW / Bogyó Gergő", "contact_label": "Privacycontact:", "contact_text": "Vragen over gegevensverwerking en verzoeken om verwijdering kunnen naar dit e-mailadres worden gestuurd.", "data_h": "2. Welke gegevens verwerkt MATCHFLOW?", "data_p1": "Voor het gebruik van bepaalde MATCHFLOW-functies is een gebruikersaccount vereist.", "data_p2": "Bij het aanmaken en gebruiken van een account verwerkt MATCHFLOW de gegevens die nodig zijn voor authenticatie via Firebase Authentication. MATCHFLOW gebruikt authenticatie met e-mailadres/wachtwoord. De applicatie gebruikt geen aanmelding met een Google-account.", "data_p3": "De applicatie kan ook wedstrijdgegevens verwerken die door de gebruiker zijn aangemaakt en ingevoerd, waaronder:", "items": ["wedstrijdgegevens;", "rondegegevens;", "weeg- en resultaatgegevens;", "notities en andere informatie die de gebruiker in verband met wedstrijden invoert."], "not_sell": "MATCHFLOW verkoopt geen persoonsgegevens van gebruikers.", "purpose_h": "3. Doeleinden van gegevensverwerking", "purpose_p": "Gegevens worden gebruikt voor doeleinden die nodig zijn voor de werking van de applicatie, waaronder:", "purpose_items": ["het identificeren en aanmelden van de gebruiker;", "het opslaan van door de gebruiker aangemaakte wedstrijden en resultaten;", "het bieden van cloud-synchronisatie;", "het herstellen van eerdere wedstrijden en resultaten;", "het onderhouden van de werking, prestaties en beveiliging van de applicatie;", "het analyseren van het gebruik van de applicatie en functies via Firebase Analytics."], "provider_h": "4. Externe dienstverleners", "provider_p": "De applicatie gebruikt Google Firebase-diensten, waaronder:", "provider_items": ["Firebase Authentication – gebruikersauthenticatie via e-mailadres/wachtwoord;", "Cloud Firestore – cloudopslag en synchronisatie van gegevens;", "Firebase Analytics – statistische analyse van applicatiegebruik en gebeurtenissen."], "provider_end": "Firebase is een dienst van Google. Gegevens en gebruiksgebeurtenissen worden verwerkt voor zover dat nodig is voor de werking van de diensten en de verbetering van de applicatie.", "security_h": "5. Gegevensbeveiliging", "security_p": "MATCHFLOW en de door de applicatie gebruikte diensten passen passende technische en organisatorische maatregelen toe om ongeautoriseerde toegang tot, verlies van of ongeoorloofd gebruik van verwerkte gegevens te voorkomen.", "retention_h": "6. Bewaren en verwijderen van gegevens", "retention_p1": "Gebruikersgegevens worden bewaard zolang dit nodig is voor de werking van de applicatie of totdat de gebruiker om verwijdering verzoekt, met inachtneming van wettelijke bewaarplichten.", "retention_p2": "De gebruiker kan verwijdering van het account en persoonsgegevens aanvragen via het volgende e-mailadres:", "retention_p3": "Na ontvangst van een verwijderingsverzoek neemt MATCHFLOW de nodige maatregelen om de betreffende gegevens te verwijderen, behalve gegevens die wettelijk moeten worden bewaard.", "rights_h": "7. Rechten van gebruikers", "rights_p": "Afhankelijk van de toepasselijke wetgeving kan de gebruiker het recht hebben om:", "rights_items": ["informatie te vragen over verwerkte persoonsgegevens;", "correctie van onjuiste gegevens te vragen;", "verwijdering van persoonsgegevens te vragen;", "beperking van de verwerking te vragen wanneer aan de wettelijke voorwaarden is voldaan;", "bezwaar te maken tegen verwerking wanneer aan de toepasselijke wettelijke voorwaarden is voldaan."], "rights_end": "Dergelijke verzoeken kunnen worden gestuurd naar het contactadres dat in dit Privacybeleid wordt vermeld.", "children_h": "8. Gegevens van kinderen", "children_p": "MATCHFLOW is niet bedoeld voor kinderen en verzamelt niet bewust persoonsgegevens van kinderen.", "changes_h": "9. Wijzigingen in dit Privacybeleid", "changes_p1": "Dit Privacybeleid kan indien nodig worden bijgewerkt, bijvoorbeeld wanneer functies van de applicatie of de manier van gegevensverwerking verandert.", "changes_p2": "De actuele versie is altijd beschikbaar op deze pagina.", "contact_h": "10. Contact", "contact_p": "Voor privacyvragen, verzoeken over gegevensverwerking of verwijderingsverzoeken kunt u contact opnemen met:", "footer": "MATCHFLOW / Bogyó Gergő", "email": "matchflowhungary@gmail.com"}, "cs": {"title": "MATCHFLOW – Zásady ochrany osobních údajů", "effective": "Účinnost od:", "date": "11. září 2026.", "intro": "Tyto Zásady ochrany osobních údajů vysvětlují, jak MATCHFLOW („Aplikace“) zpracovává osobní údaje uživatelů mobilní aplikace MATCHFLOW.", "h1": "1. Správce údajů", "controller": "MATCHFLOW / Bogyó Gergő", "contact_label": "Kontakt pro ochranu osobních údajů:", "contact_text": "Dotazy týkající se zpracování údajů a žádosti o jejich vymazání lze zasílat na tuto e-mailovou adresu.", "data_h": "2. Jaké údaje MATCHFLOW zpracovává?", "data_p1": "K používání některých funkcí MATCHFLOW je vyžadován uživatelský účet.", "data_p2": "Při vytvoření a používání účtu zpracovává MATCHFLOW údaje nezbytné k ověření identity prostřednictvím Firebase Authentication. MATCHFLOW používá ověřování pomocí e-mailu a hesla. Aplikace nepoužívá přihlášení pomocí účtu Google.", "data_p3": "Aplikace může také zpracovávat soutěžní údaje vytvořené a zadané uživatelem, například:", "items": ["údaje o soutěžích;", "údaje o kolech;", "údaje o vážení a výsledcích;", "poznámky a další informace zadané uživatelem v souvislosti se soutěžemi."], "not_sell": "MATCHFLOW neprodává osobní údaje uživatelů.", "purpose_h": "3. Účely zpracování údajů", "purpose_p": "Údaje jsou používány pro účely nezbytné k provozu aplikace, zejména:", "purpose_items": ["identifikace a přihlášení uživatele;", "ukládání soutěží a výsledků vytvořených uživatelem;", "zajištění cloudové synchronizace;", "obnovení předchozích soutěží a výsledků;", "zajištění provozu, výkonu a bezpečnosti aplikace;", "analýza používání aplikace a jejích funkcí pomocí Firebase Ana  podmienky."], "rights_end": "Takéto žiadosti je možné zaslať na kontaktnú e-mailovú adresu uvedenú v týchto Zásadách ochrany osobných údajov.", "children_h": "8. Údaje detí", "children_p": "MATCHFLOW nie je určený pre deti a vedome nezhromažďuje osobné údaje detí.", "changes_h": "9. Zmeny týchto Zásad ochrany osobných údajov", "changes_p1": "Tieto Zásady môžu byť podľa potreby aktualizované, napríklad ak sa zmenia funkcie aplikácie alebo spôsob spracúvania údajov.", "changes_p2": "Aktuálna verzia bude vždy dostupná na tejto stránke.", "contact_h": "10. Kontakt", "contact_p": "V prípade otázok týkajúcich sa ochrany osobných údajov, spracúvania údajov alebo ich vymazania kontaktujte:", "footer": "MATCHFLOW / Bogyó Gergő", "email": "matchflowhungary@gmail.com"}};

}
function render(lang){

  `;
